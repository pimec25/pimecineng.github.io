<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — PIMEC Innovative Engineering</title>
    <script>
      /*
        GitHub Pages serves only this root-level 404.html for the whole site, so it
        doubles as the single-page-app fallback for the client portal.

        The portal at /pimec-client-portal/ is a client-side-routed app: only
        index.html exists on disk, so a direct visit or hard refresh on a route
        such as /pimec-client-portal/dashboard lands here instead. When that
        happens, pull in the portal's app shell while leaving the address bar
        untouched, so the router still sees the route the visitor asked for.

        Any other unknown path falls through to the ordinary not-found message below.
      */
      (function () {
        var base = "/pimec-client-portal";
        var path = window.location.pathname;
        if (path !== base && path.indexOf(base + "/") !== 0) return;

        fetch(base + "/index.html", { credentials: "same-origin" })
          .then(function (res) {
            if (!res.ok) throw new Error("shell unavailable");
            return res.text();
          })
          .then(function (html) {
            document.open();
            document.write(html);
            document.close();
          })
          .catch(function () {
            // Last resort: send them to the portal entry point rather than a dead end.
            window.location.replace(base + "/");
          });
      })();
    </script>
    <style>
      :root {
        --bg: #0b1b2b;
        --card: #12293d;
        --text: #eef4fa;
        --muted: #9db3c8;
        --accent: #d08a4e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.55;
      }
      main {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 40px 32px;
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 14px;
      }
      h1 { font-size: 26px; margin: 0 0 12px; }
      p { color: var(--muted); margin: 0 0 26px; font-size: 16px; }
      .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 9px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
      }
      .primary { background: var(--accent); color: #17222c; }
      .secondary {
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: var(--text);
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">PIMEC Innovative Engineering</p>
      <h1>We couldn't find that page</h1>
      <p>The link may be out of date or mistyped.</p>
      <div class="links">
        <a class="primary" href="/">Go to homepage</a>
        <a class="secondary" href="/pimec-client-portal/">Client portal</a>
      </div>
    </main>
  </body>
</html>
